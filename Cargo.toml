[package]
name = "wc"
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
strip = true
panic = "abort"
lto = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.6", features = ["derive"] }
memmap2 = "0.9.11"
rayon = "1.12.0"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }   # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }    # BETA LINTS
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
